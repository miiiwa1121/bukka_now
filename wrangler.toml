name = "bukka-now"
main = "server/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [{ pattern = "bukka-now.miiiwa.com", custom_domain = true }]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "bukka-now-db"
database_id = "8b4c99fe-240d-4cd0-b37d-2595b8ea0234"
migrations_dir = "./migrations"
